capability:
  id: squad
  name: SQuAD extractive question answering
  metric_name: exact_match
  secondary_metrics:
    - f1
  higher_is_better: true
  dataset_path: squad
  train_split: train
  eval_split: validation
  eval_limit: 1000
  max_new_tokens: 64
  epsilon: 0.02
  target_source: gold
  prompt:
    template: "Answer the question using the exact span from the context."
