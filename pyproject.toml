[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idn-capability-extraction"
version = "0.1.0"
description = "IDN capability extraction prototype: teacher/base deployment and dataset evaluation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.45",
  "accelerate>=0.33",
  "datasets>=2.20",
  "numpy>=1.24",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "safetensors>=0.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
gpu = ["bitsandbytes>=0.43", "peft>=0.13", "trl>=0.10"]

[project.scripts]
idn-cap = "idn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
